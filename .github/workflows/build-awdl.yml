name: build-awdl-airplay

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write   # 用于发布 Release（单个文件可直接下载，不用拉 120MB 的 artifact）

jobs:
  build:
    name: 编译 AWDL 修复版 AirportItlwm（x86_64）
    runs-on: macos-15-intel   # 唯一免费的 Intel runner；Air 是 i5-7200U，必须出 x86_64
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 拉取上游 itlwm 源码（master）
        run: |
          set -euo pipefail
          curl -L --retry 5 --retry-delay 3 -sS -o itlwm.tar.gz \
            https://github.com/OpenIntelWireless/itlwm/archive/refs/heads/master.tar.gz
          tar xzf itlwm.tar.gz
          mv itlwm-master src
          git -C src init -q .
          git -C src -c user.email=ci@local -c user.name=ci add -A
          git -C src -c user.email=ci@local -c user.name=ci commit -qm upstream
          echo "上游 commit: $(git -C src rev-parse --short HEAD)  文件数: $(git -C src ls-files | wc -l)"

      - name: 打 AWDL 补丁（三重断言，幂等）
        run: python3 patches/enable-awdl.py src

      - name: 记录补丁 diff
        run: |
          set -euo pipefail
          git -C src diff > awdl-fix.diff
          echo "diff 行数: $(wc -l < awdl-fix.diff)"
          cat awdl-fix.diff

      - name: 安装 MacKernelSDK
        run: git clone --depth=1 https://github.com/acidanthera/MacKernelSDK.git src/MacKernelSDK

      - name: 环境信息
        run: |
          sw_vers
          echo "宿主架构: $(uname -m)"
          xcodebuild -version | head -2

      - name: 编译 Release（全部变体）
        working-directory: src
        run: |
          set -o pipefail
          xcodebuild -scheme "AirportItlwm (all)" -configuration Release \
            -derivedDataPath build GIT_COMMIT=_awdl 2>&1 | tail -50

      - name: 产物清单 + 双断言（架构 / 补丁已编入）
        run: |
          set -euo pipefail
          D=src/build/Build/Products/Release
          echo "=== Release 目录 ==="
          ls -1 "$D"
          echo
          echo "=== 定位所有 kext ==="
          find "$D" -maxdepth 4 -name "*.kext" -type d | sort | tee /tmp/kexts.txt
          echo
          echo "=== 各变体明细 ==="
          while IFS= read -r kext; do
            bin="$kext/Contents/MacOS/AirportItlwm"
            [ -f "$bin" ] || continue
            printf "%-22s %-30s %12s B %-8s v=%s\n" \
              "$(basename "$(dirname "$kext")")" "$(basename "$kext")" \
              "$(stat -f %z "$bin")" "$(lipo -archs "$bin")" \
              "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$kext/Contents/Info.plist" 2>/dev/null || echo '?')"
          done < /tmp/kexts.txt
          echo
          echo "=== 断言 1：所有变体必须是 x86_64 且含 Info.plist ==="
          while IFS= read -r kext; do
            bin="$kext/Contents/MacOS/AirportItlwm"
            [ -f "$bin" ] || { echo "::error::$kext 缺二进制"; exit 1; }
            [ -f "$kext/Contents/Info.plist" ] || { echo "::error::$kext 缺 Info.plist"; exit 1; }
            archs="$(lipo -archs "$bin")"
            case "$archs" in *x86_64*) ;; *) echo "::error::$bin 架构为 $archs，不是 x86_64"; exit 1;; esac
          done < /tmp/kexts.txt
          echo "全部 x86_64 ✔"
          echo "=== 断言 2：补丁必须真的编进 Ventura 变体 ==="
          VBIN="$(grep '/Ventura/' /tmp/kexts.txt | head -1)/Contents/MacOS/AirportItlwm"
          echo "Ventura 二进制: $VBIN"
          strings -a "$VBIN" > /tmp/vstr.txt     # 先落盘，避免管道被 grep -q 提前关闭导致 strings 报错
          if ! grep -q "failed to attach AWDL interface" /tmp/vstr.txt; then
            echo "::error::Ventura 变体里找不到补丁字符串，补丁没编进去"
            exit 1
          fi
          echo "Ventura 变体含 AWDL attach 逻辑 ✔"
          echo "=== 断言 3：源码 diff 必须是这次真正打上的 ==="
          grep -q "inf->registerService();" awdl-fix.diff || { echo "::error::diff 里没有 registerService"; exit 1; }
          grep -q "failed to attach AWDL interface" awdl-fix.diff || { echo "::error::diff 里没有 attach 检查"; exit 1; }
          echo "diff 内容正确 ✔（$(grep -c '^+' awdl-fix.diff) 行新增 / $(grep -c '^-' awdl-fix.diff) 行删除）"

      - name: 打包（按 OpenCore 命名：AirportItlwm_<变体>.kext）
        run: |
          set -euo pipefail
          mkdir -p out stage
          while IFS= read -r kext; do
            variant="$(basename "$(dirname "$kext")")"
            case "$variant" in
              Ventura)     target="AirportItlwm_Ventura.kext" ;;
              Monterey)    target="AirportItlwm_Monterey.kext" ;;
              Sonoma14.0)  target="AirportItlwm_Sonoma.kext" ;;
              Sonoma14.4)  target="AirportItlwm.kext" ;;
              Mojave)      target="AirportItlwm_Mojave.kext" ;;
              *)           target="AirportItlwm_${variant// /}.kext" ;;
            esac
            rm -rf "stage/$target"
            cp -R "$kext" "stage/$target"
            ( cd stage && zip -qry "$GITHUB_WORKSPACE/out/${target%.kext}-awdlfix.zip" "$target" )
            echo "打包 $variant → ${target%.kext}-awdlfix.zip"
          done < /tmp/kexts.txt
          cp awdl-fix.diff out/
          ( cd out && shasum -a 256 * > SHA256SUMS.txt && ls -lh )
          # 每个变体的二进制指纹，写进 Release 说明
          {
            echo "构建日期: $(date -u +%Y-%m-%dT%H:%MZ)"
            echo "上游 commit: $(git -C src rev-parse --short HEAD)"
            echo "Xcode: $(xcodebuild -version | head -1)"
            echo "宿主架构: $(uname -m)"
            echo
            echo "| 变体 | 目标文件名 | 二进制大小 | CFBundleVersion |"
            echo "|---|---|---|---|"
          } > release-notes.md
          while IFS= read -r kext; do
            variant="$(basename "$(dirname "$kext")")"
            bin="$kext/Contents/MacOS/AirportItlwm"
            [ -f "$bin" ] || continue
            case "$variant" in
              Ventura)    t="AirportItlwm_Ventura.kext" ;;
              Monterey)   t="AirportItlwm_Monterey.kext" ;;
              Sonoma14.0) t="AirportItlwm_Sonoma.kext" ;;
              Sonoma14.4) t="AirportItlwm.kext" ;;
              Mojave)     t="AirportItlwm_Mojave.kext" ;;
              *)          t="AirportItlwm_${variant// /}.kext" ;;
            esac
            echo "| $variant | \`$t\` | $(stat -f %z "$bin") B | $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$kext/Contents/Info.plist") |" >> release-notes.md
          done < /tmp/kexts.txt
          {
            echo
            echo "**Ventura（macOS 13）用户只需下载 \`AirportItlwm_Ventura-awdlfix.zip\`**，解压后得到 \`AirportItlwm_Ventura.kext\`，按 README §5 替换。"
            echo
            echo "替换前请先备份原 kext（见 README §5.3 / §7 回滚）。"
          } >> release-notes.md
          cat release-notes.md

      - name: 发布 Release（单个文件可直接下载）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="ci-$(date -u +%Y%m%d)-${{ github.run_number }}"
          gh release create "$TAG" out/*.zip out/awdl-fix.diff out/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "AWDL fix (x86_64) · $TAG" \
            --notes-file release-notes.md \
            --latest
          echo "已发布: $(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url -q .url)"

      - uses: actions/upload-artifact@v4
        with:
          name: AirportItlwm-awdlfix-x86_64
          path: out/
          if-no-files-found: error
